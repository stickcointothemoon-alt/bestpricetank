  force = true

[[redirects]]
  from = "/spritpreise-gubin"
  to = "/spritpreise-gubin.html"
  status = 301
  force = true

[[redirects]]
  from = "/spritpreise-hagenwerder"
  to = "/spritpreise-hagenwerder.html"
