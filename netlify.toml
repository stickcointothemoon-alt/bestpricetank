[build]
  publish  = "dist"
  functions = "netlify/functions"
  # Schreibt die Live-Preise in die statischen Seiten. Ohne diesen Schritt
  # tragen die Unterseiten die Platzhalter aus dem Quelltext.
  command  = "node scripts/build-pages.js"

[build.environment]
  # Das Build-Skript nutzt fs.cpSync und AbortSignal.timeout.
  NODE_VERSION = "20"

# Live-Preise zur Laufzeit:
#   /.netlify/functions/de-prices  → Tankerkönig (DE), mit Zwischenspeicher
#   /.netlify/functions/dp-prices  → Dyskont Paliwowy (PL) + NBP-Wechselkurse
#   /.netlify/functions/cz-prices  → ČSÚ-Wochendurchschnitt (CZ)

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"

# ── Eine Adresse je Seite ───────────────────────────────────────────────
# Netlify liefert jede Seite unter zwei Adressen aus: /x und /x.html.
# In der Woche vom 13.09.2026 kamen rund 690 Aufrufe auf den Varianten ohne
# Endung an - derselbe Inhalt unter zwei Adressen teilt die Google-Signale
# auf. Alle canonical-Angaben zeigen auf die .html-Fassung, also leiten wir
# dorthin. force = true ist noetig, weil Netlify die Datei sonst direkt
# ausliefert, ohne die Weiterleitung anzuwenden.
[[redirects]]
  from = "/spritpreise-polen"
  to = "/spritpreise-polen.html"
  status = 301
  force = true

[[redirects]]
  from = "/spritpreise-goerlitz"
  to = "/spritpreise-goerlitz.html"
  status = 301
  force = true

