# Alte Kurzform, die noch verlinkt wird.
[[redirects]]
  from = "/slubice.html"
  to = "/spritpreise-slubice.html"
  status = 301
  force = true

# ── Apple-Touch-Icons ───────────────────────────────────────────────────
# iOS fragt von sich aus nach Namensvarianten, die es nicht gibt:
# -precomposed, -120x120, -152x152 und weitere. Das waren rund 990 vergebliche
# Anfragen pro Woche. status = 200 liefert das vorhandene Icon aus, ohne
# umzuleiten; die echte Datei gewinnt weiterhin, weil force fehlt.
[[redirects]]
  from = "/apple-touch-icon*"
  to = "/apple-touch-icon.png"
  status = 200
