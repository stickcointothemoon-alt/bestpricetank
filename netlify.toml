[build]
  publish = "."
  functions = "netlify/functions"

# Live-Preise:
#   /.netlify/functions/de-prices  → Tankerkönig (DE), mit Zwischenspeicher
#   /.netlify/functions/dp-prices  → Dyskont Paliwowy (PL) + NBP-Wechselkurse
#   /.netlify/functions/cz-prices  → ČSÚ-Wochendurchschnitt (CZ)
#
# Die früheren /api/pl-prices- und /api/config-Weiterleitungen sind entfallen:
# sie zeigten auf Functions, die es nicht mehr bzw. nie gab.

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
