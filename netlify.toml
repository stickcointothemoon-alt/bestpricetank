[build]
  publish  = "dist"
  functions = "netlify/functions"
  # Schreibt die Live-Preise in die statischen Seiten. Ohne diesen Schritt
  # tragen die Unterseiten die Platzhalter aus dem Quelltext.
  command  = "node scripts/build-pages.js"

[build.environment]
  # Das Build-Skript nutzt fs.cpSync und AbortSignal.timeout.
  NODE_VERSION = "20"

# Live-Preise zur Laufzeit:
#   /.netlify/functions/de-prices  → Tankerkönig (DE), mit Zwischenspeicher
#   /.netlify/functions/dp-prices  → Dyskont Paliwowy (PL) + NBP-Wechselkurse
#   /.netlify/functions/cz-prices  → ČSÚ-Wochendurchschnitt (CZ)

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
