# Schreibt zweimal taeglich den Preisverlauf fort und laesst Netlify neu bauen,
# damit auch die statischen Ortsseiten frische Preise bekommen.
#
# Der Build wird am Ende IMMER ueber den Build-Hook angestossen, unabhaengig
# davon, ob es etwas zu committen gab.
#
# Warum nicht einfach auf den Commit vertrauen: Am 19.09.2026 hat der Lauf um
# 17:57 sauber einen Punkt committet und gepusht - Netlify hat darauf aber
# nicht gebaut, und data/history.json blieb auf der Seite leer. Pushes aus dem
# Workflow heraus erreichen den Netlify-Build offenbar nicht zuverlaessig.
# Der Hook tut es, das ist belegt. Ein Build dauert rund zehn Sekunden, ein
# gelegentlich doppelter kostet also praktisch nichts - eine Kurve, die sich
# nicht fuellt, kostet mehr.
#
# Einrichtung, einmalig:
#   1. Netlify → Site configuration → Build & deploy → Build hooks
#      → "Add build hook", Name z. B. "Taegliche Preise", Branch main.
#      Netlify zeigt eine URL wie https://api.netlify.com/build_hooks/xxxx
#   2. GitHub → Settings → Secrets and variables → Actions → New secret
#      Name: NETLIFY_BUILD_HOOK, Wert: diese URL
#
# Der Verlauf selbst braucht kein Secret: scripts/verlauf.js liest die
# oeffentlichen Funktionen der eigenen Seite.

name: Preisverlauf und täglicher Build

on:
  schedule:
    - cron: '10 5 * * *'    # 07:10 deutscher Sommerzeit
    - cron: '10 15 * * *'   # 17:10 deutscher Sommerzeit
  workflow_dispatch:

jobs:
  verlauf:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # noetig, damit der Lauf data/history.json pushen darf

    steps:
      - name: Quelltext holen
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Faellt eine Preisquelle aus, endet das Skript mit Code 2 und schreibt
      # nichts. Das ist gewollt: eine Luecke in der Kurve ist ehrlicher als ein
      # geschaetzter Punkt. Der Lauf soll deswegen aber nicht rot werden.
      - name: Preisverlauf fortschreiben
        id: verlauf
        continue-on-error: true
        run: node scripts/verlauf.js

      - name: Neuen Punkt committen
        id: commit
        run: |
          git config user.name  "PriceBot"
          git config user.email "bot@bestpricetank.de"
          git add data/history.json
          if git diff --staged --quiet; then
            echo "Kein neuer Punkt - es gab nichts zu committen."
            echo "committed=nein" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Preisverlauf $(date '+%d.%m.%Y %H:%M')"
            git push
            echo "✅ Neuer Punkt committet und gepusht."
            echo "committed=ja" >> "$GITHUB_OUTPUT"
          fi

      # Immer, nicht nur als Rueckfall. Sonst haengt der frisch gepushte Punkt
      # im Repository fest und erscheint nie auf der Seite.
      - name: Build anstoßen
        if: always()
        env:
          HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::NETLIFY_BUILD_HOOK ist nicht gesetzt - es wurde kein Build angestossen."
            echo "::error::Neue Verlaufspunkte erscheinen dann nicht auf der Seite. Siehe Kommentar oben."
            exit 1
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST -d '{}' "$HOOK")
          echo "Netlify antwortete mit HTTP $code"
          case "$code" in
            200|201|204) echo "✅ Build angestossen" ;;
            *) echo "::error::Netlify lehnte den Aufruf ab (HTTP $code)"; exit 1 ;;
          esac
